name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, Attest & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore App.sln --locked-mode

      - name: Test, publish, and package release
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/dist/*.zip'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $readme = Get-Content -Path "README.md" -Raw -Encoding utf8
          if ($readme -notmatch '(?ms)^## Installation\r?\n(.*?)(?=\r?\n## |\z)') {
            throw "Installation section not found in README.md"
          }
          $installBlock = ($Matches[1].Trim().Replace('<version>', $version)) -replace 'from the latest \[release\]\([^\)]+\)', 'from the assets below'
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, "### Installation`n`n$installBlock", [System.Text.UTF8Encoding]::new($false))
          $files = Get-ChildItem -Path "out/dist/*" -Include *.zip,*.sha256
          gh release create $tag $files --notes-file $notesPath --generate-notes --verify-tag
